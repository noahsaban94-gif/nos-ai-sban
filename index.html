  <meta property="og:title" content="נועה AI — מוח לוגיסטי וסדרנות" />
  <meta property="og:description" content="מוח לוגיסטי וסדרנות עבודה חכמה עבור ח. סבן חומרי בניין (1994) בע״מ — מעקב הזמנות, שיבוץ נהגים, דוחות בוקר, חישוב פקדונות וסנכרון גיליונות." />

  <meta name="twitter:card" content="summary_large_image" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&family=Rubik:wght@500;600;700;800;900&display=swap" rel="stylesheet">

  <script>
    // Register PWA Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch((err) => {
          console.debug('SW notice:', err);
        });
      });
    }

    // Load OneSignal Push Notifications only if an App ID was explicitly configured
    (function() {
      try {
        const savedAppId = localStorage.getItem('onesignal_app_id');
        if (savedAppId && savedAppId.trim().length > 10) {
          const osScript = document.createElement('script');
          osScript.src = 'https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js';
          osScript.defer = true;
          document.head.appendChild(osScript);

          window.OneSignalDeferred = window.OneSignalDeferred || [];
          window.OneSignalDeferred.push(async function(OneSignal) {
            try {
              await OneSignal.init({
                appId: savedAppId.trim(),
                allowLocalhostAsSecureOrigin: true,
                serviceWorkerPath: 'sw.js',
                serviceWorkerParam: { scope: '/' },
                notifyButton: { enable: false },
              });
            } catch (err) {
              console.debug('OneSignal init notice:', err);
            }
          });
        }
      } catch (_) {}
    })();
  </script>
</head>
<body class="h-full w-full overflow-hidden text-slate-900 bg-[#efeae2] select-none antialiased">
  <div id="root" class="h-full w-full">
    <!-- Instant initial splash while bundle parses -->
    <div id="pwa-app-loader" style="height: 100vh; width: 100vw; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0284c7; color: white; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; text-align: center; padding: 20px;">
      <div style="width: 80px; height: 80px; border-radius: 20px; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; margin-bottom: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.15);">
        <img src="/icon.svg" alt="נועה AI" style="width: 54px; height: 54px;" />
      </div>
      <div style="font-size: 22px; font-weight: 900; letter-spacing: -0.5px; margin-bottom: 4px;">נועה AI ❤️</div>
      <div style="font-size: 13px; font-weight: 700; color: #bae6fd; margin-bottom: 24px;">ח. סבן חומרי בניין (1994) בע״מ • מוח לוגיסטי</div>
      <div style="width: 48px; height: 4px; background: rgba(255,255,255,0.3); border-radius: 4px; overflow: hidden; position: relative;">
        <div style="width: 100%; height: 100%; background: #ffffff; animation: pwaPulse 1.2s infinite ease-in-out;"></div>
      </div>
    </div>
  </div>
  <style>
    @keyframes pwaPulse {
      0% { transform: translateX(-100%); }
      50% { transform: translateX(0); }
      100% { transform: translateX(100%); }
    }
  </style>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
